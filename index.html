<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Şehir" />
    <title>Neon Şehir</title>
    <!-- v107: açılış sahnesi — oyun kodu inerken anında görünür (harici dosya yok) -->
    <style>
      html,body{margin:0;height:100%;background:#070a12}
      #boot{position:fixed;inset:0;z-index:2147483000;overflow:hidden;color:#e8edf6;font-family:'Segoe UI',Roboto,system-ui,sans-serif;
        background:radial-gradient(120% 70% at 50% 18%,#1a1446 0%,#0c1322 45%,#070a12 75%);transition:opacity .35s ease;-webkit-user-select:none;user-select:none}
      #boot.out{opacity:0;pointer-events:none}
      #boot .moon{position:absolute;top:9%;right:14%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd23f 60%,#b8860b);box-shadow:0 0 40px 8px rgba(255,210,63,.25)}
      #boot .stars{position:absolute;inset:0 0 45% 0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 28% 8%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 44% 30%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 63% 14%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 82% 34%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 92% 6%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 40%,#fff5 50%,transparent 51%);animation:bt 3s ease-in-out infinite alternate}
      #boot .mid{position:absolute;left:0;right:0;top:30%;text-align:center;padding:0 16px}
      #boot h1{margin:0;font-size:clamp(34px,11vw,56px);font-weight:900;letter-spacing:.06em;line-height:1.05;color:#fff;
        text-shadow:0 0 6px #ff2e8c,0 0 18px #ff2e8c,0 0 36px rgba(255,46,140,.6);animation:bf 2.6s ease-in-out infinite}
      #boot h1 span{color:#e9fdff;text-shadow:0 0 6px #19e8ff,0 0 18px #19e8ff,0 0 36px rgba(25,232,255,.6)}
      #boot p{margin:14px 0 0;font-size:14px;letter-spacing:.08em;color:#9fb0cf}
      #boot .bar{width:min(220px,60vw);height:6px;margin:18px auto 0;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
      #boot .bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#ff2e8c,#ffd23f,#19e8ff);animation:bl 1.3s ease-in-out infinite}
      #boot svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%}
      #boot .w{animation:bw 2.4s steps(1) infinite}
      #boot .w2{animation-delay:-1.1s}#boot .w3{animation-delay:-.5s}#boot .w4{animation-delay:-1.8s}
      @keyframes bl{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @keyframes bf{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.72}53%{opacity:1}}
      @keyframes bw{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes bt{from{opacity:.55}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="boot" aria-label="Neon Şehir yükleniyor" role="status">
      <div class="stars"></div>
      <div class="moon"></div>
      <div class="mid">
        <h1>NEON <span>ŞEHİR</span></h1>
        <p>Şehir uyanıyor…</p>
        <div class="bar"><i></i></div>
      </div>
      <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3d"/><stop offset="1" stop-color="#0a0d1c"/></linearGradient>
          <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11142a"/><stop offset="1" stop-color="#05070f"/></linearGradient>
        </defs>
        <path fill="url(#bg1)" d="M0 150h22v-40h18v-22h20v62h16V96h26v54h14v-70h12V60h10v20h12v70h18v-50h24v50h14V88h30v62h12v-34h22v34h16V70h14v-18h8v18h14v80h18v-60h26v60h18v-44h20v44h12v90H0z"/>
        <path fill="url(#bg2)" d="M0 178h30v-52h34v52h12v-74h28v74h20v-40h36v40h14v-90h26v90h18v-56h30v56h16v-80h34v80h16v-46h28v46h20v-64h30v64h8v62H0z"/>
        <g fill="#ffd23f"><rect class="w" x="40" y="138" width="5" height="6"/><rect class="w w2" x="52" y="150" width="5" height="6"/><rect class="w w3" x="88" y="118" width="5" height="6"/><rect class="w" x="88" y="134" width="5" height="6"/><rect class="w w4" x="176" y="102" width="5" height="6"/><rect class="w w2" x="188" y="122" width="5" height="6"/><rect class="w" x="288" y="114" width="5" height="6"/><rect class="w w3" x="300" y="130" width="5" height="6"/></g>
        <g fill="#19e8ff"><rect class="w w2" x="118" y="154" width="5" height="6"/><rect class="w" x="132" y="166" width="5" height="6"/><rect class="w w4" x="232" y="140" width="5" height="6"/><rect class="w w3" x="252" y="160" width="5" height="6"/><rect class="w" x="338" y="150" width="5" height="6"/></g>
        <g fill="#ff2e8c"><rect class="w w3" x="66" y="190" width="5" height="6"/><rect class="w" x="158" y="120" width="5" height="6"/><rect class="w w2" x="206" y="190" width="5" height="6"/><rect class="w w4" x="350" y="124" width="5" height="6"/><rect class="w" x="368" y="196" width="5" height="6"/></g>
        <rect x="0" y="236" width="400" height="4" fill="#ff2e8c" opacity=".55"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
